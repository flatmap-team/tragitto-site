<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>You're Invited — Tragitto</title>
  <meta name="description" content="Someone invited you to follow their trip on Tragitto. See their itinerary in real-time for peace of mind.">
  <meta property="og:title" content="You're Invited to Follow a Trip">
  <meta property="og:description" content="Someone shared their travel itinerary with you on Tragitto. Open the app to follow along.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23FF8FAB'/><circle cx='50' cy='38' r='8' fill='%2383C5BE'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink: #FF8FAB;
      --teal: #83C5BE;
      --green: #06D6A0;
      --cream: #FFFBF0;
      --text: #2B2D42;
      --muted: #8D99AE;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Nunito', sans-serif;
      color: var(--text);
      background: var(--cream);
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* --- Animated background --- */
    .bg-orbs {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0;
      animation: orbFade 1.2s ease-out forwards;
    }

    .orb-1 {
      width: 300px; height: 300px;
      background: rgba(255, 143, 171, 0.15);
      top: -80px; right: -60px;
      animation-delay: 0.2s;
    }

    .orb-2 {
      width: 250px; height: 250px;
      background: rgba(131, 197, 190, 0.12);
      bottom: 10%; left: -50px;
      animation-delay: 0.5s;
    }

    .orb-3 {
      width: 180px; height: 180px;
      background: rgba(6, 214, 160, 0.08);
      top: 40%; right: -30px;
      animation-delay: 0.8s;
    }

    @keyframes orbFade {
      to { opacity: 1; }
    }

    /* --- Main card --- */
    .invite-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      padding: 24px 20px;
      padding-top: max(24px, env(safe-area-inset-top));
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* --- Logo --- */
    .logo-mark {
      margin-top: 32px;
      opacity: 0;
      animation: riseIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
    }

    .logo-mark svg {
      width: 56px;
      height: 56px;
      filter: drop-shadow(0 4px 20px rgba(255, 143, 171, 0.25));
    }

    .wordmark {
      margin-top: 8px;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: -0.5px;
      color: var(--text);
      opacity: 0;
      animation: riseIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.2s forwards;
    }

    /* --- Invite card --- */
    .invite-card {
      margin-top: 36px;
      width: 100%;
      background: white;
      border-radius: 24px;
      padding: 36px 28px 32px;
      box-shadow:
        0 1px 3px rgba(43, 45, 66, 0.04),
        0 8px 32px rgba(43, 45, 66, 0.06);
      opacity: 0;
      animation: cardIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.35s forwards;
      text-align: center;
    }

    .invite-icon {
      width: 72px;
      height: 72px;
      border-radius: 22px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .invite-icon.safety {
      background: linear-gradient(135deg, rgba(6, 214, 160, 0.12), rgba(131, 197, 190, 0.10));
    }

    .invite-icon.member {
      background: linear-gradient(135deg, rgba(255, 143, 171, 0.12), rgba(255, 209, 102, 0.10));
    }

    .invite-icon svg {
      width: 36px;
      height: 36px;
    }

    /* Pulse ring behind icon */
    .invite-icon::before {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 26px;
      opacity: 0;
      animation: pulseRing 2.5s ease-in-out 1.2s infinite;
    }

    .invite-icon.safety::before {
      border: 2px solid rgba(6, 214, 160, 0.2);
    }

    .invite-icon.member::before {
      border: 2px solid rgba(255, 143, 171, 0.2);
    }

    @keyframes pulseRing {
      0%, 100% { opacity: 0; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.08); }
    }

    .invite-card h1 {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 26px;
      line-height: 1.2;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .invite-card .subtitle {
      font-size: 16px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 28px;
      font-weight: 500;
    }

    /* --- Feature bullets --- */
    .features {
      text-align: left;
      margin-bottom: 28px;
    }

    .feature-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 8px 0;
    }

    .feature-row + .feature-row {
      border-top: 1px solid rgba(141, 153, 174, 0.08);
    }

    .feature-dot {
      width: 28px;
      height: 28px;
      min-width: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
    }

    .feature-dot.green { background: rgba(6, 214, 160, 0.12); }
    .feature-dot.teal { background: rgba(131, 197, 190, 0.12); }
    .feature-dot.pink { background: rgba(255, 143, 171, 0.12); }

    .feature-dot svg {
      width: 14px;
      height: 14px;
    }

    .feature-text {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.5;
      color: var(--text);
      padding-top: 3px;
    }

    .feature-text span {
      color: var(--muted);
      font-weight: 500;
    }

    /* --- Divider --- */
    .divider {
      width: 40px;
      height: 3px;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--pink), var(--teal));
      margin: 0 auto 24px;
      opacity: 0.5;
    }

    /* --- CTA button --- */
    .cta-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px 24px;
      border: none;
      border-radius: 999px;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 17px;
      color: white;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
      overflow: hidden;
    }

    .cta-btn.safety {
      background: linear-gradient(135deg, #06D6A0, #04B886);
      box-shadow: 0 4px 20px rgba(6, 214, 160, 0.3);
    }

    .cta-btn.member {
      background: linear-gradient(135deg, #FF8FAB, #F07090);
      box-shadow: 0 4px 20px rgba(255, 143, 171, 0.3);
    }

    .cta-btn:hover {
      transform: translateY(-1px);
    }

    .cta-btn:active {
      transform: translateY(0) scale(0.99);
    }

    /* Shimmer effect on button */
    .cta-btn::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      animation: shimmer 3s ease-in-out 2s infinite;
    }

    @keyframes shimmer {
      0% { left: -100%; }
      40%, 100% { left: 150%; }
    }

    .cta-btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    /* --- Hint text --- */
    .hint {
      margin-top: 16px;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
      font-weight: 500;
    }

    /* --- Footer --- */
    .footer {
      margin-top: auto;
      padding: 32px 0 24px;
      text-align: center;
      opacity: 0;
      animation: riseIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.6s forwards;
    }

    .footer a {
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }

    .footer a:hover { color: var(--teal); }

    .footer .sep {
      display: inline-block;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--muted);
      opacity: 0.4;
      vertical-align: middle;
      margin: 0 12px;
    }

    /* --- Floating decorative elements --- */
    .float-pin {
      position: fixed;
      z-index: 0;
      opacity: 0;
      animation: floatIn 1s ease-out forwards;
    }

    .pin-1 {
      bottom: 15%;
      right: 8%;
      animation-delay: 1.5s;
    }

    .pin-2 {
      top: 18%;
      left: 6%;
      animation-delay: 1.8s;
    }

    .pin-3 {
      top: 55%;
      left: 3%;
      animation-delay: 2.1s;
    }

    @keyframes floatIn {
      from { opacity: 0; transform: translateY(10px) scale(0.8); }
      to { opacity: 0.15; transform: translateY(0) scale(1); }
    }

    /* --- Animations --- */
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* --- Responsive --- */
    @media (max-width: 380px) {
      .invite-card { padding: 28px 20px 24px; }
      .invite-card h1 { font-size: 22px; }
    }

    @media (min-width: 768px) {
      .invite-wrapper { padding-top: 60px; min-height: auto; }
      .invite-card { padding: 44px 36px 36px; }
    }
  </style>
</head>
<body>

  <!-- Background orbs -->
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- Floating decorative pins -->
  <svg class="float-pin pin-1" width="24" height="32" viewBox="0 0 24 32" fill="none">
    <path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 20 12 20s12-11 12-20C24 5.4 18.6 0 12 0z" fill="#FF8FAB"/>
    <circle cx="12" cy="11" r="4" fill="#83C5BE"/>
  </svg>
  <svg class="float-pin pin-2" width="18" height="24" viewBox="0 0 24 32" fill="none">
    <path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 20 12 20s12-11 12-20C24 5.4 18.6 0 12 0z" fill="#83C5BE"/>
    <circle cx="12" cy="11" r="4" fill="white"/>
  </svg>
  <svg class="float-pin pin-3" width="14" height="18" viewBox="0 0 24 32" fill="none">
    <path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 20 12 20s12-11 12-20C24 5.4 18.6 0 12 0z" fill="#06D6A0"/>
    <circle cx="12" cy="11" r="4" fill="white"/>
  </svg>

  <div class="invite-wrapper">

    <!-- Logo -->
    <div class="logo-mark">
      <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="60" cy="60" r="56" fill="#FF8FAB" fill-opacity="0.08"/>
        <path d="M60 28C46.2 28 35 39.2 35 53c0 22.5 25 42 25 42s25-19.5 25-42C85 39.2 73.8 28 60 28z" fill="#FF8FAB"/>
        <circle cx="60" cy="50" r="10" fill="#83C5BE"/>
        <circle cx="60" cy="50" r="5" fill="white" fill-opacity="0.6"/>
      </svg>
    </div>
    <div class="wordmark">Tragitto</div>

    <!-- Invite card (content set by JS based on context) -->
    <div class="invite-card" id="invite-card">
      <!-- JS populates this -->
    </div>

    <p class="hint" id="hint-text"></p>

    <div class="footer">
      <a href="https://tragitto.app">tragitto.app</a>
      <span class="sep"></span>
      <a href="https://tragitto.app/privacy.html">Privacy</a>
    </div>
  </div>

  <script>
    // Detect token from path (/join/abc123) or query param (?t=abc123, from 404 redirect)
    const path = window.location.pathname;
    const params = new URLSearchParams(window.location.search);
    const tokenMatch = path.match(/\/join\/([a-zA-Z0-9_-]+)/);
    const token = tokenMatch ? tokenMatch[1] : (params.get('t') || null);

    // Play Store link (will open the app if installed via Android App Links later)
    const playStoreUrl = 'https://play.google.com/store/apps/details?id=com.flatmap.tripline';

    // We can't know from the static page if it's a safety/follower link or member link,
    // so we show a warm generic invite. The app will handle the actual join logic.
    const card = document.getElementById('invite-card');
    const hint = document.getElementById('hint-text');

    if (!token) {
      // No token — generic landing
      card.innerHTML = `
        <div class="invite-icon member">
          <svg viewBox="0 0 24 24" fill="none" stroke="#FF8FAB" stroke-width="2" stroke-linecap="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/>
            <line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
        </div>
        <h1>Join a trip on Tragitto</h1>
        <p class="subtitle">Plan trips together, share bookings, and let AI handle the details.</p>
        <div class="divider"></div>
        <a href="${playStoreUrl}" class="cta-btn member">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.609 1.814L13.792 12 3.61 22.186a.996.996 0 01-.61-.92V2.734a1 1 0 01.609-.92zM14.852 13.06l2.541 2.541-8.958 5.098 6.417-7.64zm3.684-4.741l2.473 1.405a1 1 0 010 1.74l-2.326 1.321-2.793-2.793 2.646-1.673zM8.435 3.301l8.958 5.098-2.54 2.541-6.418-7.639z"/></svg>
          Get Tragitto
        </a>
      `;
      hint.textContent = 'Available on Google Play';
    } else {
      card.innerHTML = `
        <div class="invite-icon safety">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="#06D6A0" fill-opacity="0.15" stroke="#06D6A0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M9 12l2 2 4-4" stroke="#06D6A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h1>You're invited to follow a trip</h1>
        <p class="subtitle">Someone shared their travel plans with you for peace of mind.</p>

        <div class="features">
          <div class="feature-row">
            <div class="feature-dot green">
              <svg viewBox="0 0 24 24" fill="none" stroke="#06D6A0" stroke-width="2.5" stroke-linecap="round"><path d="M5 12l5 5L19 7"/></svg>
            </div>
            <div class="feature-text">See their itinerary in real-time <span>— flights, hotels, activities</span></div>
          </div>
          <div class="feature-row">
            <div class="feature-dot teal">
              <svg viewBox="0 0 24 24" fill="none" stroke="#83C5BE" stroke-width="2.5" stroke-linecap="round"><path d="M5 12l5 5L19 7"/></svg>
            </div>
            <div class="feature-text">Know where they are <span>— locations and times updated live</span></div>
          </div>
          <div class="feature-row">
            <div class="feature-dot pink">
              <svg viewBox="0 0 24 24" fill="none" stroke="#FF8FAB" stroke-width="2" stroke-linecap="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              </svg>
            </div>
            <div class="feature-text">Their privacy is protected <span>— no booking details or private notes</span></div>
          </div>
        </div>

        <div class="divider"></div>

        <a href="${playStoreUrl}" class="cta-btn safety" id="open-btn">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.609 1.814L13.792 12 3.61 22.186a.996.996 0 01-.61-.92V2.734a1 1 0 01.609-.92zM14.852 13.06l2.541 2.541-8.958 5.098 6.417-7.64zm3.684-4.741l2.473 1.405a1 1 0 010 1.74l-2.326 1.321-2.793-2.793 2.646-1.673zM8.435 3.301l8.958 5.098-2.54 2.541-6.418-7.639z"/></svg>
          Open in Tragitto
        </a>
      `;
      hint.innerHTML = 'Free on Google Play &middot; Create an account to follow along';
    }
  </script>
</body>
</html>
