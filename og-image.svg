<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#F4F1DE"/>
  <circle cx="200" cy="100" r="300" fill="rgba(224,122,95,0.06)"/>
  <circle cx="1000" cy="500" r="250" fill="rgba(129,178,154,0.05)"/>

  <!-- Logo (route-mark) -->
  <g transform="translate(500, 120)">
    <circle cx="100" cy="100" r="90" fill="rgba(224,122,95,0.08)"/>
    <g transform="translate(100 102) scale(1.05) translate(-50 -51)">
      <line x1="21" y1="19" x2="79" y2="19" stroke="#E07A5F" stroke-width="16" stroke-linecap="round"/>
      <circle cx="50" cy="42" r="6.5" fill="#E07A5F"/>
      <circle cx="50" cy="60" r="6.5" fill="#E07A5F"/>
      <circle cx="50" cy="83" r="8.5" stroke="#81B29A" stroke-width="6" fill="none"/>
    </g>
  </g>

  <!-- Title -->
  <text x="600" y="360" text-anchor="middle" font-family="Fraunces, Georgia, -apple-system, sans-serif" font-weight="800" font-size="64" fill="#3D405B" letter-spacing="-2">Tragitto</text>
  <text x="600" y="420" text-anchor="middle" font-family="'DM Sans', -apple-system, sans-serif" font-weight="500" font-size="28" fill="#7C7F94">Travel together, effortlessly.</text>

  <!-- Feature pills -->
  <rect x="220" y="470" width="180" height="40" rx="20" fill="#81B29A"/>
  <text x="310" y="496" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-weight="600" font-size="16" fill="white">AI Concierge</text>

  <rect x="420" y="470" width="170" height="40" rx="20" fill="#F2CC8F"/>
  <text x="505" y="496" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-weight="600" font-size="16" fill="white">Smart Timeline</text>

  <rect x="610" y="470" width="190" height="40" rx="20" fill="#81B29A"/>
  <text x="705" y="496" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-weight="600" font-size="16" fill="white">Share for Safety</text>

  <rect x="820" y="470" width="170" height="40" rx="20" fill="#3D405B"/>
  <text x="905" y="496" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-weight="600" font-size="16" fill="white">Works Offline</text>
</svg>
