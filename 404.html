<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tragitto</title>
  <script>
    // GitHub Pages serves 404.html for all unknown paths.
    // If the path starts with /join/, serve the join page content.
    if (window.location.pathname.startsWith('/join/')) {
      // Redirect to join page with the token preserved in a query param
      // since GitHub Pages can't do server-side routing.
      const token = window.location.pathname.split('/join/')[1];
      window.location.replace('/join/?t=' + encodeURIComponent(token || ''));
    } else {
      // Actual 404 — redirect to homepage
      window.location.replace('/');
    }
  </script>
</head>
<body></body>
</html>
