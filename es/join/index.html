<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Estás Invitado — Tragitto</title>
  <meta name="description" content="Alguien te invitó a seguir su viaje en Tragitto. Ve su itinerario en tiempo real para tu tranquilidad.">
  <meta property="og:title" content="Estás Invitado a Seguir un Viaje">
  <meta property="og:description" content="Someone shared their travel itinerary with you on Tragitto. Open the app to follow along.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://tragitto.app/og-image.png">
  <meta property="og:locale" content="es_ES">
  <meta property="og:site_name" content="Tragitto">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Tragitto — Trip Invite">
  <meta name="twitter:description" content="Someone shared a trip with you on Tragitto.">
  <meta name="twitter:image" content="https://tragitto.app/og-image.png">
  <meta name="theme-color" content="#81B29A">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='28' fill='%23E07A5F'/><g transform='translate(50 51) scale(0.62) translate(-50 -51)'><line x1='21' y1='19' x2='79' y2='19' stroke='%23FAF7ED' stroke-width='16' stroke-linecap='round'/><circle cx='50' cy='42' r='6.5' fill='%23FAF7ED'/><circle cx='50' cy='60' r='6.5' fill='%23FAF7ED'/><circle cx='50' cy='83' r='8.5' stroke='%23F2CC8F' stroke-width='6' fill='none'/></g></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --terracotta: #E07A5F;
      --sage: #81B29A;
      --sage-alt: #81B29A;
      --cream: #F4F1DE;
      --text: #3D405B;
      --muted: #7C7F94;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      background: var(--cream);
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* --- Animated background --- */
    .bg-orbs {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0;
      animation: orbFade 1.2s ease-out forwards;
    }

    .orb-1 {
      width: 300px; height: 300px;
      background: rgba(224,122,95, 0.15);
      top: -80px; right: -60px;
      animation-delay: 0.2s;
    }

    .orb-2 {
      width: 250px; height: 250px;
      background: rgba(129,178,154, 0.12);
      bottom: 10%; left: -50px;
      animation-delay: 0.5s;
    }

    .orb-3 {
      width: 180px; height: 180px;
      background: rgba(129,178,154, 0.08);
      top: 40%; right: -30px;
      animation-delay: 0.8s;
    }

    @keyframes orbFade {
      to { opacity: 1; }
    }

    /* --- Main card --- */
    .invite-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      padding: 24px 20px;
      padding-top: max(24px, env(safe-area-inset-top));
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* --- Logo --- */
    .logo-mark {
      margin-top: 32px;
      opacity: 0;
      animation: riseIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
    }

    .logo-mark svg {
      width: 56px;
      height: 56px;
      filter: drop-shadow(0 4px 20px rgba(224,122,95, 0.25));
    }

    .wordmark {
      margin-top: 8px;
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: -0.5px;
      color: var(--text);
      opacity: 0;
      animation: riseIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.2s forwards;
    }

    /* --- Invite card --- */
    .invite-card {
      margin-top: 36px;
      width: 100%;
      background: white;
      border-radius: 24px;
      padding: 36px 28px 32px;
      box-shadow:
        0 1px 3px rgba(61,64,91, 0.04),
        0 8px 32px rgba(61,64,91, 0.06);
      opacity: 0;
      animation: cardIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.35s forwards;
      text-align: center;
    }

    .invite-icon {
      width: 72px;
      height: 72px;
      border-radius: 22px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .invite-icon.safety {
      background: linear-gradient(135deg, rgba(129,178,154, 0.12), rgba(129,178,154, 0.10));
    }

    .invite-icon.member {
      background: linear-gradient(135deg, rgba(224,122,95, 0.12), rgba(242,204,143, 0.10));
    }

    .invite-icon svg {
      width: 36px;
      height: 36px;
    }

    /* Pulse ring behind icon */
    .invite-icon::before {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 26px;
      opacity: 0;
      animation: pulseRing 2.5s ease-in-out 1.2s infinite;
    }

    .invite-icon.safety::before {
      border: 2px solid rgba(129,178,154, 0.2);
    }

    .invite-icon.member::before {
      border: 2px solid rgba(224,122,95, 0.2);
    }

    @keyframes pulseRing {
      0%, 100% { opacity: 0; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.08); }
    }

    .invite-card h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 700;
      font-size: 26px;
      line-height: 1.2;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .invite-card .subtitle {
      font-size: 16px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 28px;
      font-weight: 500;
    }

    /* --- Feature bullets --- */
    .features {
      text-align: left;
      margin-bottom: 28px;
    }

    .feature-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 8px 0;
    }

    .feature-row + .feature-row {
      border-top: 1px solid rgba(124,127,148, 0.08);
    }

    .feature-dot {
      width: 28px;
      height: 28px;
      min-width: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
    }

    .feature-dot.green { background: rgba(129,178,154, 0.12); }
    .feature-dot.teal { background: rgba(129,178,154, 0.12); }
    .feature-dot.pink { background: rgba(224,122,95, 0.12); }

    .feature-dot svg {
      width: 14px;
      height: 14px;
    }

    .feature-text {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.5;
      color: var(--text);
      padding-top: 3px;
    }

    .feature-text span {
      color: var(--muted);
      font-weight: 500;
    }

    /* --- Divider --- */
    .divider {
      width: 40px;
      height: 3px;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--terracotta), var(--sage));
      margin: 0 auto 24px;
      opacity: 0.5;
    }

    /* --- CTA button --- */
    .cta-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px 24px;
      border: none;
      border-radius: 999px;
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 700;
      font-size: 17px;
      color: white;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
      overflow: hidden;
    }

    .cta-btn.safety {
      background: linear-gradient(135deg, #81B29A, #04B886);
      box-shadow: 0 4px 20px rgba(129,178,154, 0.3);
    }

    .cta-btn.member {
      background: linear-gradient(135deg, #E07A5F, #C8553D);
      box-shadow: 0 4px 20px rgba(224,122,95, 0.3);
    }

    .cta-btn:hover {
      transform: translateY(-1px);
    }

    .cta-btn:active {
      transform: translateY(0) scale(0.99);
    }

    /* Shimmer effect on button */
    .cta-btn::after {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      animation: shimmer 3s ease-in-out 2s infinite;
    }

    @keyframes shimmer {
      0% { left: -100%; }
      40%, 100% { left: 150%; }
    }

    .cta-btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    /* --- Hint text --- */
    .hint {
      margin-top: 16px;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
      font-weight: 500;
    }

    /* --- Footer --- */
    .footer {
      margin-top: auto;
      padding: 32px 0 24px;
      text-align: center;
      opacity: 0;
      animation: riseIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.6s forwards;
    }

    .footer a {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }

    .footer a:hover { color: var(--sage); }

    .footer .sep {
      display: inline-block;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--muted);
      opacity: 0.4;
      vertical-align: middle;
      margin: 0 12px;
    }

    /* --- Floating decorative elements --- */
    .float-pin {
      position: fixed;
      z-index: 0;
      opacity: 0;
      animation: floatIn 1s ease-out forwards;
    }

    .pin-1 {
      bottom: 15%;
      right: 8%;
      animation-delay: 1.5s;
    }

    .pin-2 {
      top: 18%;
      left: 6%;
      animation-delay: 1.8s;
    }

    .pin-3 {
      top: 55%;
      left: 3%;
      animation-delay: 2.1s;
    }

    @keyframes floatIn {
      from { opacity: 0; transform: translateY(10px) scale(0.8); }
      to { opacity: 0.15; transform: translateY(0) scale(1); }
    }

    /* --- Animations --- */
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* --- Responsive --- */
    @media (max-width: 380px) {
      .invite-card { padding: 28px 20px 24px; }
      .invite-card h1 { font-size: 22px; }
    }

    @media (min-width: 768px) {
      .invite-wrapper { padding-top: 60px; min-height: auto; }
      .invite-card { padding: 44px 36px 36px; }
    }
  </style>
</head>
<body>

  <!-- Background orbs -->
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- Floating decorative pins -->
  <svg class="float-pin pin-1" width="24" height="32" viewBox="0 0 24 32" fill="none">
    <path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 20 12 20s12-11 12-20C24 5.4 18.6 0 12 0z" fill="#E07A5F"/>
    <circle cx="12" cy="11" r="4" fill="#81B29A"/>
  </svg>
  <svg class="float-pin pin-2" width="18" height="24" viewBox="0 0 24 32" fill="none">
    <path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 20 12 20s12-11 12-20C24 5.4 18.6 0 12 0z" fill="#81B29A"/>
    <circle cx="12" cy="11" r="4" fill="white"/>
  </svg>
  <svg class="float-pin pin-3" width="14" height="18" viewBox="0 0 24 32" fill="none">
    <path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 20 12 20s12-11 12-20C24 5.4 18.6 0 12 0z" fill="#81B29A"/>
    <circle cx="12" cy="11" r="4" fill="white"/>
  </svg>

  <div class="invite-wrapper">

    <!-- Logo -->
    <div class="logo-mark">
      <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="60" cy="60" r="56" fill="#E07A5F" fill-opacity="0.08"/>
        <g transform="translate(60 61) scale(0.74) translate(-50 -51)">
          <line x1="21" y1="19" x2="79" y2="19" stroke="#E07A5F" stroke-width="16" stroke-linecap="round"/>
          <circle cx="50" cy="42" r="6.5" fill="#E07A5F"/>
          <circle cx="50" cy="60" r="6.5" fill="#E07A5F"/>
          <circle cx="50" cy="83" r="8.5" stroke="#81B29A" stroke-width="6"/>
        </g>
      </svg>
    </div>
    <div class="wordmark">Tragitto</div>

    <!-- Invite card (content set by JS based on context) -->
    <div class="invite-card" id="invite-card">
      <!-- JS populates this -->
    </div>

    <p class="hint" id="hint-text"></p>

    <div class="footer">
      <a href="https://tragitto.app">tragitto.app</a>
      <span class="sep"></span>
      <a href="https://tragitto.app/privacy.html">Privacidad</a>
    </div>
  </div>

  <script>
    // Detect token from path (/join/abc123) or query param (?t=abc123, from 404 redirect)
    const path = window.location.pathname;
    const params = new URLSearchParams(window.location.search);
    const tokenMatch = path.match(/\/join\/([a-zA-Z0-9_-]+)/);
    const token = tokenMatch ? tokenMatch[1] : (params.get('t') || null);

    // Platform detection
    const ua = navigator.userAgent || '';
    const isIOS = /iPhone|iPad|iPod/i.test(ua);
    const isAndroid = /Android/i.test(ua);

    // Store links
    const playStoreUrl = 'https://play.google.com/store/apps/details?id=com.flatmap.tripline';
    const appStoreUrl = 'https://apps.apple.com/app/tragitto/id6761928217';
    const storeUrl = isIOS ? appStoreUrl : playStoreUrl;
    const storeName = isIOS ? 'App Store' : 'Google Play';
    const appSchemeUrl = token ? `tragitto://join/${token}` : null;

    // Play Store icon SVG
    const playIcon = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.609 1.814L13.792 12 3.61 22.186a.996.996 0 01-.61-.92V2.734a1 1 0 01.609-.92zM14.852 13.06l2.541 2.541-8.958 5.098 6.417-7.64zm3.684-4.741l2.473 1.405a1 1 0 010 1.74l-2.326 1.321-2.793-2.793 2.646-1.673zM8.435 3.301l8.958 5.098-2.54 2.541-6.418-7.639z"/></svg>`;
    // Apple icon SVG
    const appleIcon = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>`;
    const storeIcon = isIOS ? appleIcon : playIcon;

    const card = document.getElementById('invite-card');
    const hint = document.getElementById('hint-text');

    // For the CTA button: try app first, fall back to store
    // On iOS, use the custom URL scheme to open the app directly
    const ctaUrl = (token && appSchemeUrl) ? appSchemeUrl : storeUrl;
    const ctaLabel = (token && appSchemeUrl) ? 'Open in Tragitto' : `Get on ${storeName}`;

    // Fallback: if app doesn't open within 1.5s, redirect to store
    function openAppOrStore() {
      if (!token || !appSchemeUrl) { window.location.href = storeUrl; return; }
      const start = Date.now();
      window.location.href = appSchemeUrl;
      setTimeout(() => {
        // If we're still here after 1.5s, the app didn't open — go to store
        if (Date.now() - start < 2000) {
          window.location.href = storeUrl;
        }
      }, 1500);
    }

    if (!token) {
      card.innerHTML = `
        <div class="invite-icon member">
          <svg viewBox="0 0 24 24" fill="none" stroke="#E07A5F" stroke-width="2" stroke-linecap="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/>
            <line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
        </div>
        <h1>Únete a un viaje en Tragitto</h1>
        <p class="subtitle">Planifica viajes juntos, comparte reservas y deja que la IA se encargue de los detalles.</p>
        <div class="divider"></div>
        <a href="#" onclick="openAppOrStore(); return false;" class="cta-btn member">
          ${storeIcon}
          ${ctaLabel}
        </a>
      `;
      hint.textContent = `Available on ${storeName}`;
    } else {
      card.innerHTML = `
        <div class="invite-icon safety">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="#81B29A" fill-opacity="0.15" stroke="#81B29A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M9 12l2 2 4-4" stroke="#81B29A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h1>Estás invitado a seguir un viaje</h1>
        <p class="subtitle">Alguien compartió sus planes de viaje contigo para tu tranquilidad.</p>

        <div class="features">
          <div class="feature-row">
            <div class="feature-dot green">
              <svg viewBox="0 0 24 24" fill="none" stroke="#81B29A" stroke-width="2.5" stroke-linecap="round"><path d="M5 12l5 5L19 7"/></svg>
            </div>
            <div class="feature-text">Ve su itinerario en tiempo real <span>— vuelos, hoteles, actividades</span></div>
          </div>
          <div class="feature-row">
            <div class="feature-dot teal">
              <svg viewBox="0 0 24 24" fill="none" stroke="#81B29A" stroke-width="2.5" stroke-linecap="round"><path d="M5 12l5 5L19 7"/></svg>
            </div>
            <div class="feature-text">Sabe dónde están <span>— ubicaciones y horarios actualizados en vivo</span></div>
          </div>
          <div class="feature-row">
            <div class="feature-dot pink">
              <svg viewBox="0 0 24 24" fill="none" stroke="#E07A5F" stroke-width="2" stroke-linecap="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              </svg>
            </div>
            <div class="feature-text">Privacidad protegida <span>— sin detalles de reservas ni notas privadas</span></div>
          </div>
        </div>

        <div class="divider"></div>

        <a href="#" onclick="openAppOrStore(); return false;" class="cta-btn safety" id="open-btn">
          ${storeIcon}
          ${ctaLabel}
        </a>
      `;
      hint.innerHTML = `Gratis en ${storeName} &middot; Crea una cuenta para seguir`;
    }
  </script>
</body>
</html>
