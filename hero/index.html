<style>
  /* The embed fills its container; the cream canvas blends with any letterbox.
     Drop into a page via:  <iframe src="hero/?lang=en"
       style="width:420px;height:760px;border:0;border-radius:28px"></iframe>
     Size the frame near a 9:16 ratio to avoid side bars. */
  html, body { margin: 0; height: 100%; background: transparent; }
  #root { position: fixed; inset: 0; }
</style>

<body>
<div id="root"></div>

<script type="text/babel" src="animations.jsx"></script>
<script type="text/babel" src="video/icons.jsx"></script>

<script type="text/babel" data-presets="react">
  // Chrome-less autoplay-loop player: provides the timeline context, runs its
  // own rAF clock, scales the fixed canvas to fit the container, and honors
  // prefers-reduced-motion by holding a representative still.
  const W = 1080, H = 1920;
  const REDUCE = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function HeroPlayer() {
    const duration = window.TragittoVideo.HERO_DURATION || window.TragittoVideo.DURATION;
    const [time, setTime] = React.useState(REDUCE ? 16.8 : 0);
    const [scale, setScale] = React.useState(0.3);
    const ref = React.useRef(null);

    React.useEffect(() => {
      if (REDUCE) return;
      let raf, last = null, on = true;
      const step = (ts) => {
        if (!on) return;
        if (last == null) last = ts;
        const dt = (ts - last) / 1000; last = ts;
        setTime((t) => { let n = t + dt; if (n >= duration) n = n % duration; return n; });
        raf = requestAnimationFrame(step);
      };
      raf = requestAnimationFrame(step);
      return () => { on = false; cancelAnimationFrame(raf); };
    }, [duration]);

    React.useEffect(() => {
      const el = ref.current; if (!el) return;
      const measure = () => {
        const s = Math.min(el.clientWidth / W, el.clientHeight / H);
        setScale(s > 0 ? s : 1);
      };
      measure();
      const ro = new ResizeObserver(measure);
      ro.observe(el);
      window.addEventListener("resize", measure);
      return () => { ro.disconnect(); window.removeEventListener("resize", measure); };
    }, []);

    const ctx = React.useMemo(
      () => ({ time, duration, playing: !REDUCE, setTime, setPlaying: () => {} }),
      [time, duration]
    );

    return (
      <div ref={ref} style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", overflow: "hidden", background: "transparent" }}>
        <div style={{ width: W, height: H, transform: `scale(${scale})`, transformOrigin: "center", flexShrink: 0, position: "relative" }}>
          <window.TimelineContext.Provider value={ctx}>
            {React.createElement((window.TragittoVideo.HeroScene || window.TragittoVideo.Scene))}
          </window.TimelineContext.Provider>
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<HeroPlayer></HeroPlayer>);
</script>
</body>
